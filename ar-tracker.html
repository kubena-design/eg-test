<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR Image Tracking - Artivive Style</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            transition: opacity 0.5s;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* AR UI Overlay */
        #ar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .instruction-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .instruction-box h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #667eea;
        }

        .instruction-box p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .instruction-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Status indicator */
        .status-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Target found notification */
        .target-found {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .target-found.show {
            opacity: 1;
        }

        /* Download trigger button */
        .download-trigger-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .download-trigger-btn:active {
            transform: scale(0.95);
        }

        /* Camera viewport hint */
        .camera-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 400px;
            aspect-ratio: 1;
            border: 3px dashed rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            pointer-events: none;
        }

        .camera-frame::before {
            content: '📷';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
        }

        /* Mobile optimization */
        @media (max-width: 768px) {
            .instruction-box {
                padding: 20px 25px;
            }

            .instruction-box h2 {
                font-size: 1.2rem;
            }

            .instruction-box p {
                font-size: 0.95rem;
            }

            .download-trigger-btn {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <h2>Inicializace WebAR...</h2>
        <p id="loading-text">Aktivace kamery a načítání prostředí</p>
    </div>

    <!-- AR Scene -->
    <a-scene
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- 3D Model s animací -->
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- Camera -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- AR Target Entity -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- 3D Model -->
            <a-gltf-model
                rotation="0 0 0"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                src="#avatarModel"
                animation-mixer="clip: *; loop: repeat; clampWhenFinished: false"
                class="ar-model">
            </a-gltf-model>

            <!-- Ambient Light -->
            <a-light type="ambient" intensity="0.5"></a-light>

            <!-- Directional Light -->
            <a-light type="directional" intensity="0.8" position="1 1 1"></a-light>
        </a-entity>
    </a-scene>

    <!-- AR UI Overlay -->
    <div id="ar-overlay">
        <!-- Status Indicator -->
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Skenování...</span>
        </div>

        <!-- Target Found Notification -->
        <div class="target-found" id="target-found">
            ✅ Trigger nalezen!
        </div>

        <!-- Instructions -->
        <div class="instruction-box" id="instructions">
            <div class="instruction-icon">🎯</div>
            <h2>Namiřte kameru na trigger</h2>
            <p>Stáhněte si testovací trigger obrázek tlačítkem vpravo dole a zaměřte na něj kameru telefonu.</p>
        </div>

        <!-- Camera Frame Hint -->
        <div class="camera-frame"></div>

        <!-- Download Trigger Button -->
        <button class="download-trigger-btn" onclick="downloadTrigger()">
            <span>📥</span>
            <span>Stáhnout trigger</span>
        </button>
    </div>

    <script>
        let arStarted = false;
        let targetFound = false;

        // Initialize AR
        document.addEventListener('DOMContentLoaded', function() {
            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems['mindar-image-system'];
            const loadingScreen = document.getElementById('loading-screen');
            const instructions = document.getElementById('instructions');
            const targetFoundNotif = document.getElementById('target-found');

            // Start AR after small delay
            setTimeout(() => {
                startAR();
            }, 1000);

            async function startAR() {
                try {
                    await arSystem.start();
                    arStarted = true;

                    // Hide loading screen
                    loadingScreen.classList.add('hidden');

                    console.log('AR inicialized successfully');
                } catch (error) {
                    console.error('Chyba při spouštění AR:', error);
                    document.getElementById('loading-text').textContent =
                        'Chyba: Povoľte přístup ke kameře';
                }
            }

            // Listen for target found
            const arTarget = document.querySelector('[mindar-image-target]');

            arTarget.addEventListener('targetFound', event => {
                console.log('Target nalezen!');
                targetFound = true;

                // Show notification
                targetFoundNotif.classList.add('show');

                // Hide instructions
                instructions.style.opacity = '0';

                // Update status
                document.querySelector('.status-indicator span').textContent = 'Trigger aktivní ✓';
                document.querySelector('.status-dot').style.background = '#4CAF50';

                // Hide notification after 2 seconds
                setTimeout(() => {
                    targetFoundNotif.classList.remove('show');
                }, 2000);
            });

            arTarget.addEventListener('targetLost', event => {
                console.log('Target ztracen');
                targetFound = false;

                // Show instructions again
                instructions.style.opacity = '1';

                // Update status
                document.querySelector('.status-indicator span').textContent = 'Skenování...';
                document.querySelector('.status-dot').style.background = '#FFC107';
            });

            // Handle window close
            window.addEventListener('beforeunload', () => {
                if (arStarted) {
                    arSystem.stop();
                }
            });
        });

        // Download trigger image function
        function downloadTrigger() {
            // Create temporary link
            const link = document.createElement('a');
            link.href = 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png';
            link.download = 'ar-trigger.png';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Show feedback
            const btn = document.querySelector('.download-trigger-btn span:last-child');
            const originalText = btn.textContent;
            btn.textContent = '✓ Staženo!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }

        // Prevent scrolling on mobile
        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
